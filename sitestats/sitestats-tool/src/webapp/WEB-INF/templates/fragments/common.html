<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${title}">SiteStats</title>
  <th:block th:utext="${sakaiHtmlHead}"></th:block>
  <script type="module" th:src="@{~/webcomponents/bundles/sitestats.js} + ${cdnQuery}"></script>
  <script type="module" th:src="@{/js/sitestats-tool.js}"></script>
</head>
<body>

<div th:fragment="toolHeader(title, current)">
  <header class="sakai-tool-header">
    <h1 class="sakai-tool-header__title" th:text="${title}">Statistics</h1>
    <div class="sakai-tool-header__actions sakai-no-print" role="toolbar"
         th:attr="aria-label=#{menu_tooloptions}">
      <th:block th:if="${toolMenuAvailable and !#lists.contains({'report-edit', 'report-view', 'useractivity-details'}, current)}">
        <th:block th:unless="${adminTool}">
          <a class="sakai-btn"
             th:classappend="${activeMenu == 'overview'} ? 'sakai-btn-secondary' : 'sakai-btn-ghost'"
             th:attr="aria-current=${activeMenu == 'overview'} ? 'page' : null"
             th:href="@{/home(siteId=${siteId})}" th:text="#{menu_overview}">Overview</a>
          <a class="sakai-btn"
             th:classappend="${activeMenu == 'reports'} ? 'sakai-btn-secondary' : 'sakai-btn-ghost'"
             th:attr="aria-current=${activeMenu == 'reports'} ? 'page' : null"
             th:href="@{/reports(siteId=${siteId})}" th:text="#{menu_reports}">Reports</a>
          <a th:if="${userActivityAvailable}" class="sakai-btn"
             th:classappend="${activeMenu == 'useractivity'} ? 'sakai-btn-secondary' : 'sakai-btn-ghost'"
             th:attr="aria-current=${activeMenu == 'useractivity'} ? 'page' : null"
             th:href="@{/useractivity(siteId=${siteId})}" th:text="#{menu_useractivity}">User Activity</a>
          <a class="sakai-btn"
             th:classappend="${activeMenu == 'preferences'} ? 'sakai-btn-secondary' : 'sakai-btn-ghost'"
             th:attr="aria-current=${activeMenu == 'preferences'} ? 'page' : null"
             th:href="@{/preferences(siteId=${siteId})}" th:text="#{menu_prefs}">Preferences</a>
        </th:block>
        <th:block th:if="${adminTool}">
          <a class="sakai-btn"
             th:classappend="${activeMenu == 'summary'} ? 'sakai-btn-secondary' : 'sakai-btn-ghost'"
             th:attr="aria-current=${activeMenu == 'summary'} ? 'page' : null"
             th:href="@{/summary}" th:text="#{menu_summary}">Summary</a>
          <a class="sakai-btn"
             th:classappend="${activeMenu == 'admin'} ? 'sakai-btn-secondary' : 'sakai-btn-ghost'"
             th:attr="aria-current=${activeMenu == 'admin'} ? 'page' : null"
             th:href="@{/admin}" th:text="#{menu_sitelist}">All sites</a>
          <a class="sakai-btn"
             th:classappend="${activeMenu == 'serverwide'} ? 'sakai-btn-secondary' : 'sakai-btn-ghost'"
             th:attr="aria-current=${activeMenu == 'serverwide'} ? 'page' : null"
             th:href="@{/serverwide(siteId=${siteId})}" th:text="#{menu_serverwide}">Server-wide Reports</a>
        </th:block>
      </th:block>
      <th:block th:replace="~{fragments/common :: toolActions(${current})}"></th:block>
    </div>
  </header>
</div>

<th:block th:fragment="toolActions(current)">
  <a th:if="${current == 'reports'}" class="sakai-btn sakai-btn-primary"
     th:href="@{/reports/new(siteId=${siteId})}">
    <span class="bi bi-plus-lg" aria-hidden="true"></span>
    <span th:text="#{report_new}">Add</span>
  </a>
  <th:block th:if="${current == 'report-view'}">
    <button id="print-report" type="button" class="sakai-btn sakai-btn-secondary sakai-no-print"
            th:text="#{report_print}">Print report</button>
    <details class="sakai-overflow-menu">
      <summary class="sakai-btn sakai-btn-ghost sakai-overflow-menu__toggle"
               th:attr="aria-label=#{more_actions}">
        <span class="bi bi-three-dots" aria-hidden="true"></span>
      </summary>
      <div class="sakai-overflow-menu__panel" role="menu">
        <th:block th:if="${preview}">
          <a role="menuitem" th:href="@{/reports/preview/{id}/export/xls(id=${previewId},siteId=${siteId})}"
             th:text="#{bt_export_excel}">Export XLS</a>
          <a role="menuitem" th:href="@{/reports/preview/{id}/export/csv(id=${previewId},siteId=${siteId})}"
             th:text="#{bt_export_csv}">Export CSV</a>
          <a role="menuitem" th:href="@{/reports/preview/{id}/export/pdf(id=${previewId},siteId=${siteId})}"
             th:text="#{bt_export_pdf}">Export PDF</a>
        </th:block>
        <th:block th:unless="${preview}">
          <a role="menuitem" th:href="@{/reports/{id}/export/xls(id=${report.id},siteId=${siteId})}"
             th:text="#{bt_export_excel}">Export XLS</a>
          <a role="menuitem" th:href="@{/reports/{id}/export/csv(id=${report.id},siteId=${siteId})}"
             th:text="#{bt_export_csv}">Export CSV</a>
          <a role="menuitem" th:href="@{/reports/{id}/export/pdf(id=${report.id},siteId=${siteId})}"
             th:text="#{bt_export_pdf}">Export PDF</a>
        </th:block>
      </div>
    </details>
    <a class="sakai-btn sakai-btn-ghost" th:href="@{/reports(siteId=${siteId})}"
       th:text="#{report_back}">Back</a>
  </th:block>
  <a th:if="${current == 'report-edit'}" class="sakai-btn sakai-btn-secondary"
     th:href="@{/reports(siteId=${siteId})}" th:text="#{report_back}">Back</a>
  <a th:if="${current == 'useractivity-details'}" class="sakai-btn sakai-btn-secondary"
     th:href="@{/useractivity(siteId=${siteId})}" th:text="#{back}">Back</a>
</th:block>

<div th:fragment="messages" aria-live="polite">
  <div th:if="${success}" class="sakai-banner sakai-banner--success" role="status" th:text="${success}"></div>
  <div th:if="${error}" class="sakai-banner sakai-banner--error" role="alert" th:text="${error}"></div>
</div>

</body>
</html>
