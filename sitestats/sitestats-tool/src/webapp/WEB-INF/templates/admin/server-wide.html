<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${locale}">
<head th:replace="~{fragments/common :: head(#{menu_serverwide})}"></head>
<body>
<main class="portletBody sakai-tool-body sakai-sitestats-admin">
  <div th:replace="~{fragments/common :: toolHeader(#{menu_serverwide}, 'serverwide')}"></div>
  <div th:replace="~{fragments/common :: messages}"></div>
  <nav class="sakai-tool-nav" th:attr="aria-label=#{sitestats_serverwide_report_type}">
    <a class="sakai-tool-nav__btn"
       th:classappend="${reportType == 'monthlyLogin'} ? 'is-active'"
       th:attr="aria-current=${reportType == 'monthlyLogin'} ? 'page' : null"
       th:href="@{/serverwide(siteId=${siteId},reportType='monthlyLogin')}"
       th:text="#{submenu_monthly_login_report}"></a>
    <a class="sakai-tool-nav__btn"
       th:classappend="${reportType == 'weeklyLogin'} ? 'is-active'"
       th:attr="aria-current=${reportType == 'weeklyLogin'} ? 'page' : null"
       th:href="@{/serverwide(siteId=${siteId},reportType='weeklyLogin')}"
       th:text="#{submenu_weekly_login_report}"></a>
    <a class="sakai-tool-nav__btn"
       th:classappend="${reportType == 'dailyLogin'} ? 'is-active'"
       th:attr="aria-current=${reportType == 'dailyLogin'} ? 'page' : null"
       th:href="@{/serverwide(siteId=${siteId},reportType='dailyLogin')}"
       th:text="#{submenu_daily_login_report}"></a>
    <a class="sakai-tool-nav__btn"
       th:classappend="${reportType == 'regularUsers'} ? 'is-active'"
       th:attr="aria-current=${reportType == 'regularUsers'} ? 'page' : null"
       th:href="@{/serverwide(siteId=${siteId},reportType='regularUsers')}"
       th:text="#{submenu_regular_users_report}"></a>
    <a class="sakai-tool-nav__btn"
       th:classappend="${reportType == 'hourlyUsage'} ? 'is-active'"
       th:attr="aria-current=${reportType == 'hourlyUsage'} ? 'page' : null"
       th:href="@{/serverwide(siteId=${siteId},reportType='hourlyUsage')}"
       th:text="#{submenu_hourly_usage_report}"></a>
    <a class="sakai-tool-nav__btn"
       th:classappend="${reportType == 'topActivities'} ? 'is-active'"
       th:attr="aria-current=${reportType == 'topActivities'} ? 'page' : null"
       th:href="@{/serverwide(siteId=${siteId},reportType='topActivities')}"
       th:text="#{submenu_top_activities_report}"></a>
    <a class="sakai-tool-nav__btn"
       th:classappend="${reportType == 'toolReport'} ? 'is-active'"
       th:attr="aria-current=${reportType == 'toolReport'} ? 'page' : null"
       th:href="@{/serverwide(siteId=${siteId},reportType='toolReport')}"
       th:text="#{submenu_tool_report}"></a>
  </nav>
  <sakai-sitestats-report-panel th:attr="endpoint=${reportEndpoint}"></sakai-sitestats-report-panel>
</main>
</body>
</html>
