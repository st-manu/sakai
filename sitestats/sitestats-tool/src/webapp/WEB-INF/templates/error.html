<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${locale}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${errorTitle}">SiteStats error</title>
  <th:block th:utext="${sakaiHtmlHead}"></th:block>
</head>
<body>
<main class="portletBody sakai-tool-body sakai-sitestats">
  <header class="sakai-tool-header">
    <h1 class="sakai-tool-header__title" th:text="${errorTitle}">SiteStats error</h1>
  </header>
  <div class="sakai-banner sakai-banner--error" role="alert" th:text="${error}">
    The operation could not be completed. Try again.
  </div>
</main>
</body>
</html>
