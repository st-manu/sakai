<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${locale}">
<head th:replace="~{fragments/common :: head(#{menu_useractivity})}"></head>
<body>
<main class="portletBody sakai-tool-body sakai-sitestats">
  <div th:replace="~{fragments/common :: toolHeader(#{de_resultsTable_details}, 'useractivity-details')}"></div>
  <div th:replace="~{fragments/common :: messages}"></div>
  <dl class="sitestats-details">
    <th:block th:each="detail : ${eventDetails.details}">
      <dt th:text="${detail.key}"></dt>
      <dd>
        <a th:if="${detail.type.name() == 'LINK'}" th:href="${detail.url}"
           target="_blank" rel="noreferrer" th:text="${detail.displayValue}"></a>
        <span th:unless="${detail.type.name() == 'LINK'}" th:text="${detail.displayValue}"></span>
      </dd>
    </th:block>
  </dl>
</main>
</body>
</html>
