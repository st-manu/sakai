<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${locale}">
<head th:replace="~{fragments/common :: head(#{menu_prefs})}"></head>
<body>
<main class="portletBody sakai-tool-body sakai-sitestats">
  <div th:replace="~{fragments/common :: toolHeader(#{menu_prefs}, 'preferences')}"></div>
  <div th:replace="~{fragments/common :: messages}"></div>
  <form method="post" th:action="@{/preferences}" th:object="${preferencesForm}">
    <input type="hidden" name="siteId" th:value="${siteId}"/>
    <input type="hidden" name="sakai_csrf_token" th:value="${sakaiCsrfToken}"/>
    <fieldset class="sakai-form-section">
      <legend class="sakai-form-section__title" th:text="#{instructions_prefs_general}">General options</legend>
      <div class="sakai-form-choice">
        <input id="site-tools-only" type="checkbox"
               th:field="*{listToolEventsOnlyAvailableInSite}"/>
        <label for="site-tools-only"
               th:text="#{prefs_listToolEventsOnlyAvailableInSite}"></label>
      </div>
      <div class="sakai-form-choice">
        <input id="student-own-stats" type="checkbox"
               th:field="*{showOwnStatisticsToStudents}"/>
        <label for="student-own-stats"
               th:text="#{prefs_showOwnStatisticsToStudents}"></label>
      </div>
      <div class="sakai-form-field">
        <label class="sakai-form-label" for="grades-threshold" th:text="#{prefs_grades_threshold}">
          Grade threshold (%)
        </label>
        <input id="grades-threshold" class="sakai-form-control sitestats-number-input" type="number" min="0" max="100" step="any"
               th:field="*{gradesThreshold}" th:placeholder="${#numbers.formatInteger(defaultGradesThreshold,1)}"/>
        <div class="sakai-form-help"
             th:text="#{prefs_grades_threshold_default(${#numbers.formatInteger(defaultGradesThreshold,1)})}"></div>
      </div>
    </fieldset>
    <fieldset class="sakai-form-section">
      <legend class="sakai-form-section__title" th:text="#{instructions_prefs_sep_chart}">Chart presentation options</legend>
      <div class="sakai-form-choice">
        <input id="item-labels" type="checkbox" th:field="*{itemLabelsVisible}"/>
        <label for="item-labels" th:text="#{prefs_itemLabelsVisible}"></label>
      </div>
      <div class="sakai-form-field">
        <label class="sakai-form-label" for="chart-transparency" th:text="#{prefs_chartTransparency}">
          Transparency
        </label>
        <select id="chart-transparency" class="sakai-form-control sitestats-select-auto" th:field="*{chartTransparency}">
          <option th:each="value : ${chartTransparencyChoices}"
                  th:value="${value}" th:text="${#numbers.formatPercent(value,0,0)}"></option>
        </select>
      </div>
    </fieldset>
    <fieldset class="sakai-form-section sitestats-activity-definition">
      <legend class="sakai-form-section__title" th:text="#{instructions_prefs_activity_tools}">Tools/events included as activity</legend>
      <div class="sakai-form-choice">
        <input id="all-tools" type="checkbox" th:field="*{useAllTools}"
               aria-controls="activity-event-options"/>
        <label for="all-tools" th:text="#{prefs_useAllTools}"></label>
      </div>
      <div id="activity-event-options" class="masonry-columns"
           th:if="${!#lists.isEmpty(tools)}">
        <section class="masonry-item" th:each="tool : ${tools}">
          <h2 class="sitestats-activity-tool-title" th:text="${tool.label}"></h2>
          <div class="sakai-form-choice" th:each="event : ${tool.events}">
            <input type="checkbox" th:field="*{selectedEventIds}"
                   th:value="${event.id}" th:id="${'event-' + event.id}"/>
            <label th:for="${'event-' + event.id}"
                   th:text="${event.label}"></label>
          </div>
        </section>
      </div>
    </fieldset>
    <div class="sakai-actions">
      <button class="sakai-btn sakai-btn-primary" type="submit" th:text="#{update}">Save changes</button>
      <a class="sakai-btn sakai-btn-ghost" th:href="@{/home(siteId=${siteId})}" th:text="#{cancel}">Cancel</a>
    </div>
  </form>
</main>
</body>
</html>
