<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${locale}">
<head th:replace="~{fragments/common :: head(#{menu_reports})}"></head>
<body>
<main class="portletBody sakai-tool-body sakai-sitestats">
  <div th:replace="~{fragments/common :: toolHeader(#{menu_reports}, 'reports')}"></div>
  <div th:replace="~{fragments/common :: messages}"></div>
  <div th:if="${#lists.isEmpty(reports)}" class="sakai-banner sakai-banner--info" role="status"
       th:text="#{report_noreports}">No reports are available.</div>
  <div class="sakai-table-wrap" th:if="${!#lists.isEmpty(reports)}">
    <table class="sakai-table sakai-table--hover sakai-table--stack">
      <caption class="visually-hidden" th:text="#{sitestats_reports_caption}">Saved and predefined SiteStats reports</caption>
      <thead>
        <tr>
          <th scope="col" th:text="#{th_title}">Title</th>
          <th scope="col" th:text="#{report_reportdescription}">Description</th>
          <th scope="col" class="sakai-table__actions">
            <span class="visually-hidden" th:text="#{th_action}">Actions</span>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="report : ${reports}">
          <td class="sitestats-report-title" th:attr="data-label=#{th_title}">
            <a th:href="@{/reports/{id}(id=${report.id},siteId=${siteId})}" th:text="${report.title}">Report</a>
          </td>
          <td th:attr="data-label=#{report_reportdescription}" th:text="${report.description}"></td>
          <td class="sakai-table__actions" th:attr="data-label=#{th_action}">
            <div class="sakai-row-actions">
              <details class="sakai-overflow-menu">
                <summary class="sakai-overflow-menu__toggle" th:attr="aria-label=#{more_actions}">
                  <span class="bi bi-three-dots" aria-hidden="true"></span>
                </summary>
                <div class="sakai-overflow-menu__panel" role="menu">
                  <a role="menuitem" th:if="${report.siteId != null}"
                     th:href="@{/reports/{id}/edit(id=${report.id},siteId=${siteId})}">
                    <span class="bi bi-pencil" aria-hidden="true"></span>
                    <span th:text="#{report_edit}">Edit report</span>
                  </a>
                  <button type="submit" role="menuitem" th:form="${'copy-report-' + report.id}">
                    <span class="bi bi-copy" aria-hidden="true"></span>
                    <span th:text="#{report_duplicate}">Copy report</span>
                  </button>
                  <button type="submit" role="menuitem" th:if="${report.siteId != null}"
                          th:form="${'delete-report-' + report.id}" class="sitestats-row-action--danger">
                    <span class="bi bi-trash" aria-hidden="true"></span>
                    <span th:text="#{report_delete}">Delete report</span>
                  </button>
                </div>
              </details>
            </div>
            <form th:id="${'copy-report-' + report.id}" method="post" hidden
                  th:action="@{/reports/{id}/copy(id=${report.id})}">
              <input type="hidden" name="siteId" th:value="${siteId}"/>
              <input type="hidden" name="sakai_csrf_token" th:value="${sakaiCsrfToken}"/>
            </form>
            <form th:id="${'delete-report-' + report.id}" method="post" hidden
                  th:if="${report.siteId != null}"
                  th:action="@{/reports/{id}/delete(id=${report.id})}">
              <input type="hidden" name="siteId" th:value="${siteId}"/>
              <input type="hidden" name="sakai_csrf_token" th:value="${sakaiCsrfToken}"/>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
