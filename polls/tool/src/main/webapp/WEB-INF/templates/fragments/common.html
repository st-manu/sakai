<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>

<head th:fragment="head">
    <meta charset="UTF-8"/>
    <script th:src="@{~/library/js/headscripts.js}"></script>
</head>

<th:block th:fragment="toolSecondaryActions (current)">
  <a th:if="${canAdd and current != 'import'}"
     class="sakai-btn sakai-btn-secondary"
     th:href="@{/pollImport}">
    <span class="bi bi-upload" aria-hidden="true"></span>
    <span th:text="#{action_import_polls}">Bulk Creation</span>
  </a>
  <a th:if="${isSiteOwner and current != 'permissions'}"
     class="sakai-btn sakai-btn-ghost"
     th:href="@{/votePermissions}"
     th:text="#{action_set_permissions}">Permissions</a>
</th:block>

<div th:fragment="toolActions (current)" class="sakai-tool-header__actions sakai-no-print" role="toolbar" aria-label="Poll actions">
  <th:block th:if="${current == 'list'}">
    <a th:if="${canAdd}"
       class="sakai-btn sakai-btn-primary"
       th:href="@{/voteAdd}">
      <span class="bi bi-plus-lg" aria-hidden="true"></span>
      <span th:text="#{action_add_poll}">Add</span>
    </a>

    <div class="sakai-tool-header__secondary" th:if="${canAdd or isSiteOwner}">
      <th:block th:replace="~{fragments/common :: toolSecondaryActions('list')}" />
    </div>

    <details class="sakai-overflow-menu sakai-tool-header__more" th:if="${canAdd or isSiteOwner}">
      <summary class="sakai-btn sakai-btn-ghost sakai-overflow-menu__toggle"
               th:attr="aria-label=#{action_more}">
        <span class="bi bi-three-dots" aria-hidden="true"></span>
      </summary>
      <div class="sakai-overflow-menu__panel" role="menu">
        <th:block th:replace="~{fragments/common :: toolSecondaryActions('list')}" />
      </div>
    </details>
  </th:block>

  <a th:unless="${current == 'list'}"
     class="sakai-btn sakai-btn-secondary"
     th:href="@{/votePolls}"
     th:text="#{action_return_to_list}">Return to list</a>
</div>

</body>
</html>
