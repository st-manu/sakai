<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>

<head th:fragment="head">
    <meta charset="UTF-8"/>
    <script th:src="@{~/library/js/headscripts.js}"></script>
</head>

<th:block th:fragment="toolBack">
  <a class="sakai-back-link" th:href="@{/votePolls}">
    <span class="si si-arrow-left" aria-hidden="true"></span>
    <span th:text="#{action_back_to_list}">Back to list</span>
  </a>
</th:block>

<th:block th:fragment="toolSecondaryActions">
  <a th:if="${canAdd}"
     class="sakai-btn sakai-btn-secondary"
     th:href="@{/pollImport}">
    <span class="si si-upload" aria-hidden="true"></span>
    <span th:text="#{action_import_polls}">Bulk Creation</span>
  </a>
</th:block>

<!-- P2/P3 — the overflow panel is the only place P3 lives. P2 repeats here only while
     the container is narrower than wide (data-priority hides it in the panel at wide). -->
<th:block th:fragment="toolOverflowActions">
  <a th:if="${canAdd}"
     data-priority="2"
     class="sakai-btn sakai-btn-secondary"
     th:href="@{/pollImport}">
    <span class="si si-upload" aria-hidden="true"></span>
    <span th:text="#{action_import_polls}">Bulk Creation</span>
  </a>
  <a th:if="${isSiteOwner}"
     class="sakai-btn sakai-btn-ghost"
     th:href="@{/votePermissions}"
     th:text="#{action_set_permissions}">Permissions</a>
</th:block>

<th:block th:fragment="toolActions">
  <div class="sakai-tool-header__actions sakai-no-print" role="group" th:attr="aria-label=#{poll_actions}">
    <a th:if="${canAdd}"
       class="sakai-btn sakai-btn-primary"
       th:href="@{/voteAdd}">
      <span class="si si-add" aria-hidden="true"></span>
      <span th:text="#{action_add_poll}">Add</span>
    </a>

    <div class="sakai-tool-header__secondary" th:if="${canAdd}">
      <th:block th:replace="~{fragments/common :: toolSecondaryActions}" />
    </div>

    <details class="sakai-overflow-menu sakai-tool-header__more"
             th:classappend="${isSiteOwner} ? ' sakai-tool-header__more--persistent'"
             th:if="${canAdd or isSiteOwner}">
      <summary class="sakai-btn sakai-btn-ghost sakai-overflow-menu__toggle"
               th:attr="aria-label=#{action_more}">
        <span class="si si-three-dots" aria-hidden="true"></span>
      </summary>
      <div class="sakai-overflow-menu__panel">
        <th:block th:replace="~{fragments/common :: toolOverflowActions}" />
      </div>
    </details>
  </div>
</th:block>

</body>
</html>
