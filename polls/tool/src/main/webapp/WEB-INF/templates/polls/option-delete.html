<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head}"></head>
<body>
  <div class="portletBody sakai-tool-body">
    <header class="sakai-tool-header">
      <h1 class="sakai-tool-header__title" th:text="#{delete_confirm}">Confirm delete</h1>
      <div th:replace="~{fragments/common :: toolActions('add')}"></div>
    </header>

    <div class="sak-banner-warn" role="alert">
      <p th:text="#{delete_option_message(${option.text})}">Delete message</p>
      <p th:if="${hasVotes}" th:text="#{delete_option_has_votes}">Vote handling message</p>
    </div>

    <form th:action="@{/pollOptionDelete}" method="post">
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <input type="hidden" name="optionId" th:value="${option.id}" />

      <div class="sakai-form-group" th:if="${hasVotes}">
        <div class="sakai-polls-choice-list">
          <div th:each="choice : ${handleOptions}">
            <input type="radio" name="orphanHandling" th:id="${'handle-' + choice.value()}" th:value="${choice.value()}" th:checked="${choice.value() == 'return-votes'}" />
            <label th:for="${'handle-' + choice.value()}" th:text="#{${choice.labelKey()}}">Option</label>
          </div>
        </div>
      </div>

      <div class="sakai-actions">
        <button type="submit" class="sakai-btn sakai-btn-primary" th:text="#{delete_option_confirm}">Delete</button>
        <a class="sakai-btn sakai-btn-secondary" role="button" th:href="@{/voteAdd(pollId=${poll.id})}" th:text="#{new_poll_cancel}">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
