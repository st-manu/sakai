<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head}"></head>
<body>
  <div class="portletBody sakai-tool-body">
    <header class="sakai-tool-header">
      <h1 class="sakai-tool-header__title" th:text="${optionForm.optionId == null} ? #{new_option_title} : #{edit_option_title}">Option</h1>
      <div th:replace="~{fragments/common :: toolActions('add')}"></div>
    </header>

    <div th:if="${success}" class="sak-banner-success" role="status" th:text="${success}">Success</div>
    <div th:if="${alert}" class="sak-banner-error" role="alert" th:text="${alert}">Error</div>

    <p class="sakai-polls-hint">
      <span th:text="#{new_poll_question}">Question</span>:
      <span th:utext="${poll.text}">Poll question</span>
    </p>

    <form th:action="@{/pollOption}" th:object="${optionForm}" method="post">
      <input type="hidden" th:field="*{pollId}" />
      <input type="hidden" th:field="*{optionId}" />

      <div class="sakai-form-group">
        <label class="sakai-form-label" for="option-text" th:text="#{new_poll_option}">Option</label>
        <textarea id="option-text"
                  class="sakai-form-control"
                  th:classappend="${#fields.hasErrors('text')}? ' is-invalid'"
                  rows="4"
                  th:field="*{text}"
                  required></textarea>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('text')}" th:errors="*{text}">Provide text</div>
      </div>

      <div class="sakai-actions">
        <button type="submit" name="submitAction" value="save" class="sakai-btn sakai-btn-primary" th:text="#{new_poll_submit}">Save</button>
        <button type="submit" name="submitAction" value="addAnother" class="sakai-btn sakai-btn-secondary" th:text="#{new_poll_saveoption}">Save and add options</button>
        <a class="sakai-btn sakai-btn-ghost" role="button" th:href="@{/voteAdd(pollId=${poll.id})}" th:text="#{new_poll_cancel}">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
