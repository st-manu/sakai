<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head}"></head>
<body>
  <div class="portletBody sakai-tool-body">
    <header class="sakai-tool-header">
      <h1 class="sakai-tool-header__title" th:text="#{thanks_msg}">Thank you for voting</h1>
      <div th:replace="~{fragments/common :: toolActions('list')}"></div>
    </header>

    <p th:text="#{thanks_ref}">Your reference number:</p>
    <p class="sakai-polls-question" th:text="${voteRef}">reference</p>

    <div class="sakai-actions">
      <a class="sakai-btn sakai-btn-primary" role="button" th:href="@{/votePolls}" th:text="#{thanks_done}">Back</a>
    </div>
  </div>
</body>
</html>
