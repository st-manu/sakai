<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head}"></head>
<body>
  <div class="portletBody sakai-tool-body">
    <header class="sakai-tool-header">
      <h1 class="sakai-tool-header__title" th:text="#{new_option_batch_title}">Batch upload</h1>
      <div th:replace="~{fragments/common :: toolActions('add')}"></div>
    </header>

    <p class="sakai-polls-hint">
      <span th:text="#{new_poll_question}">Question</span>:
      <span th:utext="${poll.text}">Poll question</span>
    </p>

    <form th:action="@{/pollOptionBatch}" th:object="${batchForm}" method="post" enctype="multipart/form-data">
      <input type="hidden" th:field="*{pollId}" />
      <div class="sakai-form-group">
        <label class="sakai-form-label" for="batch-file" th:text="#{new_poll_option_batch_info}">Upload instructions</label>
        <input class="sakai-form-control"
               th:classappend="${#fields.hasErrors('file')}? ' is-invalid'"
               type="file" id="batch-file" th:field="*{file}" accept=".csv,.xls,.xlsx,.txt" required />
        <div class="invalid-feedback" th:if="${#fields.hasErrors('file')}" th:errors="*{file}">Provide a valid file</div>
      </div>
      <div class="sakai-actions">
        <button type="submit" class="sakai-btn sakai-btn-primary" th:text="#{new_poll_submit}">Upload</button>
        <a class="sakai-btn sakai-btn-secondary" role="button" th:href="@{/voteAdd(pollId=${poll.id})}" th:text="#{new_poll_cancel}">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
