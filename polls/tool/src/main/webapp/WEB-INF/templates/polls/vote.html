<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head}"></head>
<body>
  <div class="portletBody sakai-tool-body">
    <header class="sakai-tool-header">
      <h1 class="sakai-tool-header__title" th:text="#{poll_vote_title}">Vote</h1>
      <div th:replace="~{fragments/common :: toolActions('list')}"></div>
    </header>

    <div th:if="${alert}" class="sak-banner-warn" role="alert" th:text="${alert}">Alert</div>
    <div th:if="${success}" class="sak-banner-success" role="status" th:text="${success}">Success</div>

    <p class="sakai-polls-question" th:utext="${poll.text}">Poll question</p>
    <div th:utext="${poll.description}"></div>

    <form th:action="@{/voteQuestion}" th:object="${voteForm}" method="post">
      <input type="hidden" th:field="*{pollId}" />
      <ul class="sakai-polls-vote-options" th:if="${options}">
        <li th:each="option : ${options}" class="sakai-polls-vote-option">
          <input th:type="${multipleChoice} ? 'checkbox' : 'radio'"
                 name="selectedOptionIds"
                 th:id="${'option-' + option.id}"
                 th:value="${option.id}"
                 th:checked="${#lists.contains(voteForm.selectedOptionIds, option.id)}" />
          <label class="sakai-polls-vote-option__label" th:for="${'option-' + option.id}" th:utext="${option.text}">Option text</label>
        </li>
      </ul>

      <div class="sakai-actions">
        <button type="submit" class="sakai-btn sakai-btn-primary" th:text="#{vote_vote}">Vote</button>
        <button type="reset" class="sakai-btn sakai-btn-secondary" th:text="#{vote_reset}">Reset</button>
        <a class="sakai-btn sakai-btn-ghost" role="button" th:href="@{/votePolls}" th:text="#{vote_cancel}">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
